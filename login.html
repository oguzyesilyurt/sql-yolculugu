<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil Seç • SQL Yolculuğu</title><link rel="stylesheet" href="style.css?v=8"></head><body class="login-page"><main class="login-card"><div class="brand-icon" style="margin:auto">✦</div><div class="pill">12 HAFTALIK SQL YOLCULUĞU</div><h1>Hoş geldin, Çiço! ✨</h1><p>Bugün kimin SQL macerasına devam ediyoruz?</p><div class="profile-choices"><button data-profile="denelsertel"><span>🌷</span><b>Denel</b><small>Denel'in yolculuğu →</small></button><button data-profile="aycelen"><span>⭐</span><b>Ayçelen</b><small>Çiço ablanın yolculuğu →</small></button></div><form id="loginForm" class="cloud-login-form"><label>Kullanıcı adı<select id="username"><option value="denelsertel">Denel</option><option value="aycelen">Ayçelen</option></select></label><label>Şifre<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Yolculuğuma devam et →</button><p id="loginError" role="status"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="cloud.js?v=9"></script><script src="profiles.js?v=9"></script><script>
document.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-profile]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('username').value=b.dataset.profile}));
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('loginError');status.textContent='Giriş yapılıyor…';try{const username=document.getElementById('username').value;await cloudLogin(username,document.getElementById('password').value);localStorage.setItem('sql-active-profile',username);location.href='hikaye.html'}catch(err){status.textContent=err.message}});
(async()=>{try{const u=await cloudUser();if(u){localStorage.setItem('sql-active-profile',u.email.split('@')[0]);location.replace('hikaye.html')}}catch{}})();
</script></body></html>
