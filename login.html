<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf1ff"><title>Giriş • SQL Yolculuğu</title><link rel="stylesheet" href="style.css?v=16"><style>
.pin-shell{margin-top:28px;text-align:left}.pin-title{font-weight:750;color:#29385b;margin-bottom:12px}.pin-input{display:block;width:100%;font-size:30px;letter-spacing:1.3rem;text-align:center;border:2px solid #dbe1fc;border-radius:19px;padding:17px 8px;background:#f9faff;color:#283760;outline:none;transition:border-color .2s,box-shadow .2s}.pin-input:focus{border-color:#6875f5;box-shadow:0 0 0 5px #6875f51c}.pin-help{font-size:13px;color:#8490b1;margin:12px 0 22px;text-align:center}.pin-dots{display:flex;justify-content:center;gap:14px;margin:14px 0}.pin-dots span{width:12px;height:12px;border-radius:50%;background:#e3e7f5;transition:background .2s,transform .2s}.pin-dots span.filled{background:#6475f4;transform:scale(1.18)}.pin-error{min-height:26px;color:#df5264;text-align:center}.login-card .profile-choices button{transition:transform .25s,box-shadow .25s,border-color .25s}.login-card .profile-choices button:hover{transform:translateY(-4px)}@media(max-width:500px){.pin-input{letter-spacing:.8rem;font-size:26px}}
</style></head><body class="login-page login-refresh"><div class="login-orb orb-a" aria-hidden="true"></div><div class="login-orb orb-b" aria-hidden="true"></div><main class="login-card" aria-labelledby="welcome"><div class="brand-icon login-logo" aria-hidden="true">✦</div><div class="pill">✦ 12 HAFTALIK SQL YOLCULUĞU</div><h1 id="welcome">Yeniden hoş geldin, Çiço! <span>✨</span></h1><p class="login-subtitle">Profilini seç, dört haneli PIN'inle kaldığın yerden devam et.</p><div class="profile-choices" role="group" aria-label="Profil seçimi"><button type="button" data-profile="denelsertel" class="selected" aria-pressed="true"><span class="avatar">🌷</span><b>Denel</b><small>Bir adım daha, çiçom!</small><i aria-hidden="true">✓</i></button><button type="button" data-profile="aycelen" aria-pressed="false"><span class="avatar">⭐</span><b>Ayçelen</b><small>Çiço ablanın yolculuğu</small><i aria-hidden="true">✓</i></button></div><form id="loginForm" class="pin-shell"><label for="pin" class="pin-title">🔒 <span id="selectedName">Denel</span> için 4 haneli PIN</label><input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" autocomplete="off" required aria-describedby="pinHelp" placeholder="••••"><div class="pin-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div><p class="pin-help" id="pinHelp">PIN'in yalnızca giriş yapmak için kullanılır.</p><button id="submitLogin" class="primary login-submit" type="submit"><span>Yolculuğuma devam et</span> <span aria-hidden="true">→</span></button><p id="loginError" class="pin-error" role="alert" aria-live="polite"></p></form><p class="login-footnote">🌱 Her gün küçük bir adım, büyük bir yolculuk.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="cloud.js?v=13"></script><script>
let selected='denelsertel';const cards=[...document.querySelectorAll('[data-profile]')],pin=document.getElementById('pin'),error=document.getElementById('loginError'),submit=document.getElementById('submitLogin'),dots=[...document.querySelectorAll('.pin-dots span')];function paint(){dots.forEach((dot,i)=>dot.classList.toggle('filled',i<pin.value.length))}function selectProfile(id){selected=id;cards.forEach(b=>{const active=b.dataset.profile===id;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});document.getElementById('selectedName').textContent=id==='denelsertel'?'Denel':'Ayçelen';pin.value='';paint();error.textContent='';pin.focus()}cards.forEach(b=>b.addEventListener('click',()=>selectProfile(b.dataset.profile)));pin.addEventListener('input',()=>{pin.value=pin.value.replace(/\D/g,'').slice(0,4);paint();error.textContent=''});document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!/^\d{4}$/.test(pin.value))return;error.textContent='';submit.disabled=true;submit.querySelector('span').textContent='Giriş yapılıyor…';try{const user=await cloudLogin(selected,pin.value);if(user.email?.split('@')[0]!==selected)throw Error('Profil doğrulanamadı');localStorage.setItem('sql-active-profile',selected);location.replace('hikaye.html')}catch(err){error.textContent=err.message||'Giriş yapılamadı.';pin.value='';paint();pin.focus()}finally{submit.disabled=false;submit.querySelector('span').textContent='Yolculuğuma devam et'}});(async()=>{try{const u=await cloudUser();const name=u?.email?.split('@')[0];if(name==='denelsertel'||name==='aycelen'){localStorage.setItem('sql-active-profile',name);location.replace('hikaye.html')}}catch{}})();
</script></body></html>
