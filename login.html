<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf1ff"><title>Giriş • SQL Yolculuğu</title><link rel="stylesheet" href="style.css?v=10"></head><body class="login-page login-refresh"><div class="login-orb orb-a" aria-hidden="true"></div><div class="login-orb orb-b" aria-hidden="true"></div><main class="login-card" aria-labelledby="welcome"><div class="brand-icon login-logo" aria-hidden="true">✦</div><div class="pill">✦ 12 HAFTALIK SQL YOLCULUĞU</div><h1 id="welcome">Yeniden hoş geldin, Çiço! <span>✨</span></h1><p class="login-subtitle">Kendi yolculuğunu seç, kaldığın yerden devam et.</p><div class="profile-choices" role="group" aria-label="Profil seçimi"><button type="button" data-profile="denelsertel" class="selected" aria-pressed="true"><span class="avatar">🌷</span><b>Denel</b><small>Bir adım daha, çiçom!</small><i aria-hidden="true">✓</i></button><button type="button" data-profile="aycelen" aria-pressed="false"><span class="avatar">⭐</span><b>Ayçelen</b><small>Çiço ablanın yolculuğu</small><i aria-hidden="true">✓</i></button></div><form id="loginForm" class="cloud-login-form"><label for="password">Şifren <span id="selectedName">· Denel</span></label><div class="password-wrap"><input id="password" type="password" required autocomplete="current-password" placeholder="Şifreni gir" spellcheck="false"><button id="togglePassword" type="button" aria-label="Şifreyi göster" aria-pressed="false">Göster</button></div><button id="submitLogin" class="primary login-submit" type="submit"><span>Yolculuğuma devam et</span> <span aria-hidden="true">→</span></button><p id="loginError" role="alert" aria-live="polite"></p></form><p class="login-footnote">🌱 Her gün küçük bir adım, büyük bir yolculuk.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="cloud.js?v=10"></script><script>
let selected='denelsertel';const cards=[...document.querySelectorAll('[data-profile]')];const pass=document.getElementById('password');const error=document.getElementById('loginError');const submit=document.getElementById('submitLogin');function selectProfile(id){selected=id;cards.forEach(b=>{const active=b.dataset.profile===id;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});document.getElementById('selectedName').textContent=id==='denelsertel'?'· Denel':'· Ayçelen';pass.value='';error.textContent='';pass.focus()}cards.forEach(b=>b.addEventListener('click',()=>selectProfile(b.dataset.profile)));document.getElementById('togglePassword').addEventListener('click',e=>{const visible=pass.type==='password';pass.type=visible?'text':'password';e.currentTarget.textContent=visible?'Gizle':'Göster';e.currentTarget.setAttribute('aria-pressed',String(visible))});document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.querySelector('span').textContent='Giriş yapılıyor…';try{await cloudLogin(selected,pass.value);localStorage.setItem('sql-active-profile',selected);location.replace('hikaye.html')}catch(err){error.textContent=err.message||'Giriş yapılamadı. Lütfen tekrar dene.';pass.focus()}finally{submit.disabled=false;submit.querySelector('span').textContent='Yolculuğuma devam et'}});(async()=>{try{const u=await cloudUser();if(u){localStorage.setItem('sql-active-profile',u.email.split('@')[0]);location.replace('hikaye.html')}}catch{}})();
</script></body></html>
